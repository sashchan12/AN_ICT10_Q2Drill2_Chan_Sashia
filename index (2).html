<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OBMC Club Roster</title>

  <link rel="stylesheet" href="https://pyscript.net/releases/2024.11.1/core.css">
  <script type="module" src="https://pyscript.net/releases/2024.11.1/core.js"></script>

  <!--FOR REFERENCE: I asked Claude.AI to help me with the style because we were permitted to-->
  <style>
    :root {
      --ink: #1d2740;
      --paper: #ffffff;
      --mist: #eef2f8;
      --gold: #f2b134;
      --teal: #1b998b;
      --line: #cdd5e3;
    }

    body {
      margin: 0;
      padding: 40px 20px 60px;
      font-family: "Gill Sans", "Gill Sans MT", Calibri, Arial, sans-serif;
      font-size: 17px;
      line-height: 25px;
      color: var(--ink);
      background-color: var(--ink);

      background-image:
        linear-gradient(rgba(29, 39, 64, 0.72), rgba(29, 39, 64, 0.72)),
        url("images/bg.jpg");
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }

    .wrap {
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      display: flex;
      align-items: center;
      gap: 24px;
      margin-bottom: 28px;
    }

    .logo {
      flex: 0 0 96px;
      width: 96px;
      height: 96px;
      border: 2px dashed var(--gold);
      border-radius: 48px;
      background-color: rgba(255, 255, 255, 0.08);
      background-image: url("images/logo.png");
      background-size: cover;
      background-position: center;
      color: var(--gold);
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: 50px;
      line-height: 54px;
      font-weight: 700;
      color: var(--paper);
    }

    header p {
      margin: 8px 0 0;
      font-size: 19px;
      color: var(--gold);
    }

    .card {
      background: var(--paper);
      border-radius: 12px;
      padding: 28px;
      margin-bottom: 24px;
    }

    .card h2 {
      margin: 0 0 16px;
      font-size: 26px;
      line-height: 30px;
    }

    .fields {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 24px;
    }

    .field {
      flex: 1 1 240px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-weight: 700;
    }

    input[type="text"] {
      padding: 12px 14px;
      font-family: inherit;
      font-size: 17px;
      color: var(--ink);
      background: var(--mist);
      border: 2px solid var(--line);
      border-radius: 8px;
    }

    input[type="text"]:focus {
      outline: 3px solid var(--teal);
      outline-offset: 1px;
      border-color: var(--teal);
    }

    .picker-label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
    }

    .picker {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .picker input {
      position: absolute;
      opacity: 0;
    }

    .pill {
      padding: 10px 20px;
      font-weight: 700;
      color: var(--ink);
      background: var(--mist);
      border: 2px solid var(--line);
      border-radius: 24px;
      cursor: pointer;
    }

    .picker input:checked + .pill {
      color: var(--paper);
      background: var(--teal);
      border-color: var(--teal);
    }

    .picker input:focus-visible + .pill {
      outline: 3px solid var(--gold);
      outline-offset: 2px;
    }

    button {
      margin-top: 24px;
      padding: 12px 30px;
      font-family: inherit;
      font-size: 17px;
      font-weight: 700;
      color: var(--ink);
      background: var(--gold);
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    button:hover { background: #e39f1f; }
    button:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }

    .clubs {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 24px;
    }

    .club {
      flex: 1 1 200px;
      background: var(--paper);
      border-radius: 12px;
      overflow: hidden;
    }

    .photo {
      height: 110px;
      background-color: var(--mist);
      background-size: cover;
      background-position: center;
      border-bottom: 4px solid var(--gold);
      color: #6b7a99;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .club-varsity  { background-image: url("VARSITY.jpg"); }
    .club-science  { background-image: url("sci.jpg"); }
    .club-computer { background-image: url("cs.jpg"); }
    .club-math     { background-image: url("math.jpg"); }

    .club h3 {
      margin: 0;
      padding: 12px 16px 0;
      font-size: 20px;
      line-height: 26px;
    }

    .members {
      min-height: 90px;
      padding: 8px 16px 16px;
      font-size: 15px;
      line-height: 23px;
    }

    #output {
      min-height: 80px;
      padding: 24px 28px;
      line-height: 28px;
      color: var(--paper);
      background: var(--teal);
      border-radius: 12px;
    }

    @media (max-width: 600px) {
      h1 { font-size: 36px; line-height: 40px; }
      header { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>

<body>
  <div class="wrap">

    <header>
      <div class="logo">DRILL 2</div>
      <div>
        <h1>OBMC Club Roster</h1>
        <p>Pick a club, add a new member, and watch the lists update.</p>
      </div>
    </header>

    <section class="card">
      <h2>Add new club member</h2>

      <div class="fields">
        <label class="field">First name
          <input type="text" id="first-name" placeholder="e.g. Juan">
        </label>
        <label class="field">Last name
          <input type="text" id="last-name" placeholder="e.g. Dela Cruz">
        </label>
      </div>
 
      <span class="picker-label">Which club are they joining?</span>
      <div class="picker">
        <input type="radio" name="club" id="pick-varsity" value="varsity" checked>
        <label class="pill" for="pick-varsity">Varsity</label>

        <input type="radio" name="club" id="pick-science" value="science">
        <label class="pill" for="pick-science">Science Club</label>

        <input type="radio" name="club" id="pick-computer" value="computer">
        <label class="pill" for="pick-computer">Computer Club</label>

        <input type="radio" name="club" id="pick-math" value="math">
        <label class="pill" for="pick-math">Math Club</label>
      </div>

  
      <button type="button" py-click="add_member">Add member</button>
    </section>

    <section class="clubs">
      <div class="club">
        <div class="photo club-varsity"></div>
        <h3>Varsity</h3>
        <div class="members" id="members-varsity"></div>
      </div>
      <div class="club">
        <div class="photo club-science"></div>
        <h3>Science Club</h3>
        <div class="members" id="members-science"></div>
      </div>
      <div class="club">
        <div class="photo club-computer"></div>
        <h3>Computer Club</h3>
        <div class="members" id="members-computer"></div>
      </div>
      <div class="club">
        <div class="photo club-math"></div>
        <h3>Math Club</h3>
        <div class="members" id="members-math"></div>
      </div>
    </section>
    
    <div id="output"></div>

  </div>

  <script type="py" src="main.py"></script>
</body>
</html>
